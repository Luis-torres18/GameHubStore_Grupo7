spring.application.name=notification-service
server.port=8083


spring.datasource.url=jdbc:h2:mem:db_notification_service
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt:
secret: GameHub-JWT-DSY1103-Spring-Security-Token-Key