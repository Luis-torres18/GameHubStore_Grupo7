spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # ─── Rutas de negocio ───────────────────────────────────────────
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product/**

            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/api/category/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payment/**

            - id: shipping-service
              uri: lb://shipping-service
              predicates:
                - Path=/api/shipping/**

            - id: promotion-service
              uri: lb://promotion-service
              predicates:
                - Path=/api/promotion/**

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/review/**

            - id: warranty-service
              uri: lb://warranty-service
              predicates:
                - Path=/api/warranty/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**

            # ─── Rutas OpenAPI (Swagger) ────────────────────────────────────
            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/api-docs/product
              filters:
                - RewritePath=/api-docs/product, /v3/api-docs

            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/api-docs/user
              filters:
                - RewritePath=/api-docs/user, /v3/api-docs

            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/api-docs/order
              filters:
                - RewritePath=/api-docs/order, /v3/api-docs

            - id: category-service-docs
              uri: lb://category-service
              predicates:
                - Path=/api-docs/category
              filters:
                - RewritePath=/api-docs/category, /v3/api-docs

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html
    urls:
      - name: product
        url: /api-docs/product
      - name: user
        url: /api-docs/user
      - name: order
        url: /api-docs/order
      - name: category
        url: /api-docs/category

jwt:
  secret: GameHub-JWT-DSY1103-Spring-Security-Token-Key