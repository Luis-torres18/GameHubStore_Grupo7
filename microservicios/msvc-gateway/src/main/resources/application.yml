spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      server:
        webmvc:
          # Cada ruta: si la URL entra por el patron 'predicates', el gateway la reenvia
          # a 'uri'. lb:// significa "busca este nombre en Eureka y balancea la carga".
          routes:
            - - id: auth-service
            - uri: lb://auth-service
            - predicates:
            - Path=/api/auth/**
            -
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product/**

            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/api/category/**

            - id: Inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
            - id: order-service
              uri: lb://order-service
              predicates:
                Path=/api/order/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                Path=/api/payment/**
            - id: shipping-service
              uri: lb://shipping-service
              predicates:
                -Path=/api/shipping/**

            - id: promotion-service
              uri: lb://promotion-service
              predicates:
                - Path=/api/promotion/**

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/review/**

            - id: warranty-service
              uri: lb://warranty-service
              predicates:
                - Path=/api/warranty/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**

            # Rutas para el OpenAPI (JSON) de cada microservicio. El Swagger UI del gateway
            # las consume. Usan el prefijo /api-docs/<svc> (NO /v3/api-docs) para no chocar con
            # el /v3/api-docs propio del gateway. RewritePath lo traduce al /v3/api-docs real del servicio.
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product/**
              filters:
                - RewritePath=/api-docs/product, /v3/api-docs

            - id: user-service
            - uri: lb://user-service
              predicates:
                - Path=/api/user/**
            - filters:
                RewritePath=/api-docs/user, /v3/api-docs
                -

            - id: order-service
              uri: lb://order-service
              predicates:
                Path=/api/order/**
              filters:
                - RewritePath=/api-docs/order, /v3/api-docs


            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/api/category/**
              filters:
                - RewritePath=/api-docs/category, /v3/api-docs
                -

                # Punto de entrada unico: todo el trafico entra por aqui.
server:
  port: 8080

# El gateway tambien es cliente Eureka para poder resolver los lb://
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Swagger UI agregado: una sola pagina con un desplegable para elegir el microservicio.
springdoc:
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html
    # El desplegable apunta a los docs de cada servicio (ruteados por el gateway via lb://).
    urls:
      - name: product
        url: /api-docs/product
      - name: user
        url: /api-docs/user
      - name: order
        url: /api-docs/order
      - name: category
        url: /api-docs/category

# CLAVE SECRETA JWT: la MISMA que en msvc-usuarios y en los 3 microservicios. El gateway la usa para validar.
jwt:
  secret: clave-secreta-super-segura-para-jwt-hospital-msvc-duoc-2026-0616
