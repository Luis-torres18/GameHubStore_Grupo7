spring.application.name=auth-service-test

spring.datasource.url=jdbc:h2:mem:db_auth_service_test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=GameHubStore2024SecretKeyForJWTSigning123456
jwt.expiration=86400000

# Evita que el contexto de test intente registrarse en Eureka
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
